name: Release

on:
  push:
    tags: ['v*.*.*']
  # Alternativ von Hand (Actions > Release > Run workflow, Branch main): legt den Tag vX.Y.Z selbst an.
  workflow_dispatch:

permissions:
  contents: write

env:
  PANEL_IMAGE: ghcr.io/calagopus/panel:1.2.10-heavy-aio

jobs:
  release:
    # Releases nur aus dem oeffentlichen Repo (Veroeffentlichung erst nach Freigabe).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' backend/Cargo.toml | head -n 1)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF_NAME" = main || { echo "Run the release workflow on main, not $GITHUB_REF_NAME"; exit 1; }
            if gh release view "v$version" >/dev/null 2>&1; then echo "Release v$version already exists"; exit 1; fi
          else
            test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match backend/Cargo.toml version $version"; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } } found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          cat notes.md
      - name: Package
        run: ./scripts/package.sh
      - name: Check in panel image
        run: docker run --rm -v "$PWD:/ext" --entrypoint sh "$PANEL_IMAGE" /ext/scripts/check-in-panel.sh /ext/dist/de_taxz_theme.c7s.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # --target legt den Tag beim Start von Hand auf genau diesem Commit an; bei einem Tag-Push gibt es ihn schon.
        run: gh release create "$TAG" dist/de_taxz_theme.c7s.zip dist/de_taxz_theme.c7s.zip.sha256 --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
